services:
  cf-test:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: cf-test
    ports:
      - "10966:2222"
    environment:
      - USER_NAME=testuser
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=test
      - SUDO_ACCESS=true
      - PUBLIC_KEY=ssh-rsa 
    restart: unless-stopped
